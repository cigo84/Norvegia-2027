<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lofoten Ski Touring - Mappa Start Point</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 50vh;
            height: 50dvh;
            flex-shrink: 0;
            z-index: 1;
        }

        #sidebar {
            width: 100%;
            flex: 1;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            z-index: 2;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.4);
            border-top: 1px solid #334155;
            overflow: hidden;
        }

        .header {
            padding: 10px 15px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
        }

        .header h1 {
            font-size: 1.05rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls {
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
        }

        .search-box { position: relative; }
        .search-box input {
            width: 100%;
            padding: 8px 12px 8px 35px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            font-size: 0.85rem;
        }
        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        #route-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .route-card {
            background: #1e293b;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            border-left: 4px solid #cbd5e1;
        }

        .route-card.MS { border-left-color: #22c55e; }
        .route-card.BS { border-left-color: #3b82f6; }
        .route-card.OS { border-left-color: #f97316; }
        .route-card.OSA { border-left-color: #ef4444; }

        .route-title { font-weight: 700; font-size: 0.95rem; color: #f1f5f9; display: flex; justify-content: space-between; }
        .route-meta { display: flex; gap: 10px; font-size: 0.75rem; color: #94a3b8; margin-top: 5px; }
        .route-desc { font-size: 0.8rem; color: #cbd5e1; margin-top: 6px; line-height: 1.4; }

        .badge { font-size: 0.7rem; padding: 2px 5px; border-radius: 4px; font-weight: bold; color: #fff; }
        .badge.MS { background: #22c55e; }
        .badge.BS { background: #3b82f6; }
        .badge.OS { background: #f97316; }
        .badge.OSA { background: #ef4444; }

        .leaflet-popup-content-wrapper { background: #0f172a; color: #f8fafc; border-radius: 10px; border: 1px solid #334155; padding: 2px; }
        .leaflet-popup-tip { background: #0f172a; }
        .popup-content h3 { color: #38bdf8; font-size: 1.1rem; margin-bottom: 4px; }
        .popup-info { font-size: 0.85rem; margin-bottom: 8px; color: #cbd5e1; }
        
        .popup-links { display: flex; flex-direction: column; gap: 6px; }
        .popup-links a { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px; text-decoration: none; border-radius: 6px; font-size: 0.8rem; font-weight: 600; border: 1px solid #334155; }
        
        .popup-links a.gmaps-btn { background: #059669; color: #fff; border: none; }
        .popup-links a.btn-wikiloc { background: #c2410c; color: #fff; border: none; }
        .popup-links a.btn-gulliver { background: #0284c7; color: #fff; border: none; }
        .popup-links a.btn-c2c { background: #475569; color: #fff; border: none; }

        @media (min-width: 769px) {
            .app-container { flex-direction: row-reverse; }
            #map { flex: 1; height: 100%; }
            #sidebar { width: 380px; height: 100%; border-top: none; border-right: 1px solid #334155; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="map"></div>
        <div id="sidebar">
            <div class="header">
                <h1><i class="fa-solid fa-map-pin"></i> Lofoten - Punti di Partenza</h1>
            </div>

            <div class="controls">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Cerca itinerario..." onkeyup="filterRoutes()">
                </div>
            </div>

            <div id="route-list"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // LE COORDINATE ORA SONO QUELLE ESATTE DEI PARCHEGGI (START POINTS) E NON DELLE VETTE.
        const routes = [
            { id: 1, name: "Geitgaljen", area: "Laupstad", lat: 68.3751, lng: 14.6738, elev: 1085, gain: 1085, diff: "OSA", exp: "S", desc: "Regina delle Lofoten. Posizione pin: Parcheggio presso Liland/Laupstad." },
            { id: 2, name: "Pilan & Sautinden", area: "Laupstad", lat: 68.3686, lng: 14.6543, elev: 828, gain: 800, diff: "BS", exp: "S/SW", desc: "Classica sicura e gettonata. Posizione pin: Parcheggio lungo la E10." },
            { id: 3, name: "Kvittinden", area: "Austnesfjorden", lat: 68.3571, lng: 14.6062, elev: 745, gain: 745, diff: "MS", exp: "S", desc: "Bellissima sciata sul fiordo. Posizione pin: Parcheggio E10 vicino a Sildpollnes." },
            { id: 4, name: "Torskmannen", area: "Sydal", lat: 68.3371, lng: 14.5367, elev: 755, gain: 740, diff: "BS", exp: "SE", desc: "Ampi pendii continui. Posizione pin: Parcheggio al porticciolo di Sydal." },
            { id: 5, name: "Varden", area: "Svolvær", lat: 68.2435, lng: 14.5458, elev: 464, gain: 450, diff: "MS", exp: "S", desc: "La gita sopra casa. Posizione pin: Parcheggio dell'asilo Knutmarka a Svolvær." },
            { id: 6, name: "Småtindan", area: "Kabelvåg", lat: 68.2045, lng: 14.3942, elev: 662, gain: 650, diff: "BS", exp: "S", desc: "Una delle uscite più belle. Posizione pin: Parcheggio di Ørsnes." },
            { id: 7, name: "Glomtinden", area: "Henningsvær", lat: 68.2163, lng: 14.4042, elev: 419, gain: 400, diff: "MS", exp: "S/SE", desc: "Ottima per giornate di brutto tempo. Posizione pin: Passo di Rørvikskaret." },
            { id: 8, name: "Festvågtinden", area: "Henningsvær", lat: 68.1678, lng: 14.2140, elev: 541, gain: 540, diff: "BS", exp: "S", desc: "A picco sul mare. Posizione pin: Piazzola a Festvåg, prima dei ponti." },
            { id: 9, name: "Hoven", area: "Gimsøya", lat: 68.3344, lng: 14.0950, elev: 368, gain: 360, diff: "MS", exp: "360", desc: "Gita isolata sulla spiaggia. Posizione pin: Parcheggio del Golf Club Hov." },
            { id: 10, name: "Justadtinden", area: "Vestvågøya", lat: 68.2125, lng: 13.8820, elev: 738, gain: 700, diff: "MS", exp: "SE", desc: "Lunga e panoramica. Posizione pin: Ampio parcheggio al passo Hagskaret." },
            { id: 11, name: "Himmeltinden", area: "Haukland", lat: 68.1996, lng: 13.5292, elev: 964, gain: 950, diff: "BS", exp: "W", desc: "Sopra spiagge caraibiche. Posizione pin: Parcheggio spiaggia di Haukland." },
            { id: 12, name: "Stornappstinden", area: "Flakstad", lat: 68.1278, lng: 13.4357, elev: 740, gain: 730, diff: "BS", exp: "N", desc: "Polvere garantita a nord. Posizione pin: Uscita Sud tunnel di Napp (Nappskaret)." },
            { id: 13, name: "Ryten", area: "Fredvang", lat: 68.0833, lng: 13.1558, elev: 543, gain: 530, diff: "MS", exp: "SW", desc: "Vistosa scogliera su Kvalvika. Posizione pin: Parcheggio Innersand (Fredvang)." },
            { id: 14, name: "Volandstinden", area: "Fredvang", lat: 68.0818, lng: 13.1973, elev: 547, gain: 540, diff: "BS", exp: "N", desc: "Piccola piramide appuntita. Posizione pin: Slargo incrocio Skjelfjord/Fredvang." },
            { id: 15, name: "Munkan", area: "Sørvågen", lat: 67.8893, lng: 13.0163, elev: 775, gain: 760, diff: "BS", exp: "SE", desc: "Nel selvaggio sud. Posizione pin: Parcheggio scuola/municipio di Sørvågen." }
        ];

        const map = L.map('map', { zoomControl: false }).setView([68.22, 14.10], 9);
        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/{z}/{y}/{x}.png', {
            maxZoom: 18, attribution: '© Kartverket'
        }).addTo(map);

        function getColor(d) {
            return d === 'MS' ? '#22c55e' : d === 'BS' ? '#3b82f6' : d === 'OS' ? '#f97316' : '#ef4444';
        }

        let markers = [];

        function renderRoutes(data) {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            const list = document.getElementById('route-list');
            list.innerHTML = '';

            data.forEach(route => {
                // LINK DIRETTI AI MOTORI DI RICERCA INTERNI (Funzionano al 100%)
                const nameURI = encodeURIComponent(route.name);
                
                // Google Maps usa le coordinate esatte del parcheggio, quindi aprirà l'app calcolando la strada vera.
                const navMap = 'https://www.google.com/maps/dir/?api=1&destination=' + route.lat + ',' + route.lng;
                
                // Gulliver ricerca tramite la sua stringa query nativa (?s=nome)
                const searchGulliver = 'https://www.gulliver.it/?s=' + nameURI;
                
                // Wikiloc ricerca filtrata su Norvegia/Scialpinismo
                const searchWikiloc = 'https://it.wikiloc.com/percorsi/sci-alpinismo/norvegia?q=' + nameURI;
                
                // Camptocamp usa il motore Waypoints
                const searchC2C = 'https://www.camptocamp.org/waypoints?q=' + nameURI;

                const popup = `
                    <div class="popup-content">
                        <h3>${route.name}</h3>
                        <div class="popup-info">
                            <strong><i class="fa-solid fa-parking"></i> Parcheggio:</strong> ${route.area}<br>
                            <strong>Cima:</strong> +${route.gain}m | Diff: <span class="badge ${route.diff}">${route.diff}</span><br>
                            <p style="margin-top:5px; font-size:0.75rem;">${route.desc}</p>
                        </div>
                        <div class="popup-links">
                            <a href="${navMap}" target="_blank" class="gmaps-btn"><i class="fa-solid fa-car"></i> Naviga al Parcheggio</a>
                            <a href="${searchWikiloc}" target="_blank" class="btn-wikiloc"><i class="fa-solid fa-route"></i> Cerca Traccia Wikiloc</a>
                            <a href="${searchGulliver}" target="_blank" class="btn-gulliver"><i class="fa-solid fa-book"></i> Cerca Relazione Gulliver</a>
                            <a href="${searchC2C}" target="_blank" class="btn-c2c"><i class="fa-solid fa-mountain"></i> Cerca su Camptocamp</a>
                        </div>
                    </div>`;

                const marker = L.marker([route.lat, route.lng], { 
                    icon: L.divIcon({
                        className: 'custom-pin',
                        html: `<div style="background-color: ${getColor(route.diff)}; width:16px; height:16px; border-radius:50%; border:2px solid white; box-shadow:0 0 5px #000;"></div>`,
                        iconSize: [16, 16]
                    })
                }).bindPopup(popup).addTo(map);

                markers.push(marker);

                const card = document.createElement('div');
                card.className = 'route-card ' + route.diff;
                card.innerHTML = `
                    <div class="route-title"><span>${route.name}</span><span class="badge ${route.diff}">${route.diff}</span></div>
                    <div class="route-meta"><span><i class="fa-solid fa-mountain"></i> ${route.elev}m</span> <span><i class="fa-solid fa-arrow-up-long"></i> +${route.gain}m</span></div>
                    <div class="route-desc"><strong><i class="fa-solid fa-parking"></i> Parcheggio:</strong> ${route.desc}</div>`;

                card.addEventListener('click', () => { map.setView([route.lat, route.lng], 13); marker.openPopup(); });
                list.appendChild(card);
            });
        }

        function filterRoutes() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderRoutes(routes.filter(r => r.name.toLowerCase().includes(q) || r.area.toLowerCase().includes(q)));
        }

        renderRoutes(routes);
    </script>
</body>
</html>
