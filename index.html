<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lofoten Ski Touring - Mappa Completa</title>
    
    <!-- Leaflet CSS & FontAwesome -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; height: 100dvh; background-color: #0f172a; color: #f8fafc; overflow: hidden; }
        .app-container { display: flex; flex-direction: column; width: 100%; height: 100%; }
        #map { width: 100%; height: 45vh; height: 45dvh; flex-shrink: 0; z-index: 1; }
        #sidebar { width: 100%; flex: 1; background: #0f172a; display: flex; flex-direction: column; z-index: 2; box-shadow: 0 -4px 15px rgba(0,0,0,0.4); border-top: 1px solid #334155; overflow: hidden; }
        .header { padding: 10px 15px; background: #1e293b; border-bottom: 1px solid #334155; }
        .header h1 { font-size: 1.05rem; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .header p { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
        .controls { padding: 10px 15px; display: flex; flex-direction: column; gap: 8px; background: #0f172a; border-bottom: 1px solid #334155; }
        
        .gps-btn { background: #10b981; color: white; border: none; padding: 8px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.8rem; }
        .gps-btn:active { background: #059669; }
        .filter-buttons { display: flex; gap: 4px; flex-wrap: wrap; }
        .filter-btn { flex: 1; min-width: 42px; padding: 6px 3px; font-size: 0.68rem; font-weight: 600; border-radius: 6px; border: none; cursor: pointer; background: #1e293b; color: #94a3b8; text-align: center; }
        .filter-btn.active, .filter-btn:hover { background: #0284c7; color: #fff; }
        .filter-btn.classic-btn.active { background: #eab308; color: #000; font-weight: 700; }
        .filter-btn.gully-btn.active { background: #a855f7; color: #fff; }

        .search-box { position: relative; }
        .search-box input { width: 100%; padding: 8px 12px 8px 35px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 0.85rem; }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #64748b; }
        
        #route-list { flex: 1; overflow-y: auto; padding: 10px; -webkit-overflow-scrolling: touch; }
        .route-card { background: #1e293b; border-radius: 8px; padding: 12px; margin-bottom: 8px; cursor: pointer; border-left: 4px solid #cbd5e1; }
        .route-card.MS { border-left-color: #22c55e; }
        .route-card.BS { border-left-color: #3b82f6; }
        .route-card.OS { border-left-color: #f97316; }
        .route-card.OSA { border-left-color: #ef4444; }
        
        .route-title { font-weight: 700; font-size: 0.9rem; color: #f1f5f9; display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
        .route-badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
        .route-meta { display: flex; gap: 8px; font-size: 0.72rem; color: #94a3b8; margin-top: 4px; align-items: center; flex-wrap: wrap; }
        .route-desc { font-size: 0.78rem; color: #cbd5e1; margin-top: 6px; line-height: 1.3; }
        
        .badge { font-size: 0.65rem; padding: 2px 5px; border-radius: 4px; font-weight: bold; color: #fff; }
        .badge.MS { background: #22c55e; }
        .badge.BS { background: #3b82f6; }
        .badge.OS { background: #f97316; }
        .badge.OSA { background: #ef4444; }
        .badge-book { background: #334155; color: #38bdf8; border: 1px solid #0284c7; }
        .badge-classic { background: #eab308; color: #000; font-weight: 800; }
        .badge-gully { background: #8b5cf6; color: #fff; }
        
        .leaflet-popup-content-wrapper { background: #0f172a; color: #f8fafc; border-radius: 10px; border: 1px solid #334155; padding: 2px; }
        .leaflet-popup-tip { background: #0f172a; }
        .popup-content h3 { color: #38bdf8; font-size: 1.05rem; margin-bottom: 4px; }
        .popup-info { font-size: 0.8rem; margin-bottom: 8px; color: #cbd5e1; line-height: 1.4; }
        .popup-links { display: flex; flex-direction: column; gap: 6px; }
        .popup-links a { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px; text-decoration: none; border-radius: 6px; font-size: 0.8rem; font-weight: 600; border: 1px solid #334155; }
        .popup-links a.gmaps-btn { background: #059669; color: #fff; border: none; }
        .popup-links a.btn-wikiloc { background: #4fa800; color: #fff; border: none; }
        .popup-links a.btn-photo { background: #8b5cf6; color: #fff; border: none; }
        .popup-links a.btn-review { background: #0284c7; color: #fff; border: none; }
        .popup-links a.btn-varsom { background: #ea580c; color: #fff; border: none; }
        
        @media (min-width: 769px) { .app-container { flex-direction: row-reverse; } #map { flex: 1; height: 100%; } #sidebar { width: 400px; height: 100%; border-top: none; border-right: 1px solid #334155; } }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="map"></div>
        <div id="sidebar">
            <div class="header">
                <h1><i class="fa-solid fa-book-atlas"></i> Lofoten Ski Touring Map</h1>
                <p>Allineata alla guida cartacea (Sez. 1, 2 e 3) con classiche e canali.</p>
            </div>
            
            <div class="controls">
                <button class="gps-btn" onclick="locateUser()">
                    <i class="fa-solid fa-location-crosshairs"></i> Mostra la mia posizione GPS
                </button>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Cerca montagna, numero o area..." onkeyup="filterRoutes()">
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn active" onclick="filterDifficulty('ALL', this)">Tutti</button>
                    <button class="filter-btn classic-btn" onclick="filterDifficulty('CLASSIC', this)">⭐ Classiche</button>
                    <button class="filter-btn gully-btn" onclick="filterDifficulty('GULLY', this)">⛏️ Canali</button>
                    <button class="filter-btn" onclick="filterDifficulty('MS', this)">MS</button>
                    <button class="filter-btn" onclick="filterDifficulty('BS', this)">BS</button>
                    <button class="filter-btn" onclick="filterDifficulty('OS', this)">OS</button>
                    <button class="filter-btn" onclick="filterDifficulty('OSA', this)">OSA</button>
                </div>
            </div>
            
            <div id="route-list"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const routes = [
            // SEZIONE 1: Moskenesøya, Flakstadøya, Vestvågøya and Gimsøya
            { bookRef: "1.1 (p. 38)", name: "Ryten", area: "Fredvang", lat: 68.0833, lng: 13.1558, elev: 543, diff: "MS", isClassic: true, gully: false, desc: "Celebre scogliera a picco sulla spiaggia di Kvalvika. Parcheggio Innersand." },
            { bookRef: "1.2 (p. 40)", name: "Stornappstinden", area: "Napp", lat: 68.1278, lng: 13.4357, elev: 740, diff: "BS", isClassic: true, gully: false, desc: "Direttamente sopra l'imbocco del tunnel sottomarino di Napp. Ottima neve a nord." },
            { bookRef: "1.3 (p. 42)", name: "Himmeltinden", area: "Haukland", lat: 68.1996, lng: 13.5292, elev: 964, diff: "BS", isClassic: true, gully: false, desc: "La cima più alta di Vestvågøya, sovrasta le spiagge caraibiche di Haukland e Uttakleiv." },
            { bookRef: "1.4 (p. 46)", name: "Guratinden", area: "Vestvågøya", lat: 68.1402, lng: 13.5680, elev: 580, diff: "MS", isClassic: false, gully: false, desc: "Gita panoramica e veloce nel centro-sud di Vestvågøya vicino a Gravdal." },
            { bookRef: "1.5 (p. 48)", name: "Justadtinden", area: "Hagskaret", lat: 68.2125, lng: 13.8820, elev: 738, diff: "MS", isClassic: true, gully: false, desc: "Grande classica percorsa da molti scialpinisti. Partenza comoda dal valico di Hagskaret." },
            { bookRef: "1.6 (p. 52)", name: "Blåtinden", area: "Vestvågøya", lat: 68.1450, lng: 13.8310, elev: 630, diff: "BS", isClassic: false, gully: false, desc: "Cima affacciata su Stamsund con bella visuale sul mare interno." },
            { bookRef: "1.7 (p. 56)", name: "Breitinden (Rolvsfjorden)", area: "Vestvågøya", lat: 68.2450, lng: 13.7820, elev: 660, diff: "BS", isClassic: false, gully: false, desc: "Salita dal fiordo di Rolvsfjorden con costanti pendenze sciabili." },
            { bookRef: "1.8 (p. 58)", name: "Dalstuva", area: "Vestvågøya", lat: 68.1800, lng: 13.7000, elev: 562, diff: "MS", isClassic: false, gully: false, desc: "Accesso facile e rilassante nel cuore dell'isola. Ideale con meteo incerto." },
            { bookRef: "1.9 (p. 60)", name: "Hellostinden", area: "Vestvågøya", lat: 68.2560, lng: 13.8150, elev: 580, diff: "MS", isClassic: false, gully: false, desc: "Gita morbida e panoramica esposta a sud verso i pascoli di Bøstad." },
            { bookRef: "1.10 (p. 62)", name: "Håtinden", area: "Vestvågøya", lat: 68.2510, lng: 13.8340, elev: 640, diff: "MS", isClassic: false, gully: false, desc: "Cima panoramica con ampie vedute aperte verso nord e l'Oceano Atlantico." },
            { bookRef: "1.11 (p. 66)", name: "Smørtvarden", area: "Vestvågøya", lat: 68.2610, lng: 13.7420, elev: 500, diff: "MS", isClassic: false, gully: false, desc: "Dossi dolci ed ondulati ideali per principianti e uscite a basso pericolo valanghe." },
            { bookRef: "1.12 (p. 68)", name: "Rødrevheia", area: "Vestvågøya", lat: 68.2320, lng: 13.8050, elev: 650, diff: "MS", isClassic: false, gully: false, desc: "Spesso concatenata con il Limstrandstinden, ampi spazi e bella sciata." },
            { bookRef: "1.13 (p. 70)", name: "Hoven", area: "Gimsøya", lat: 68.3344, lng: 14.0950, elev: 368, diff: "MS", isClassic: true, gully: false, desc: "Montagna isolata e inconfondibile che sorge dal mare. Partenza dal Lofoten Links." },
            { bookRef: "1.14 (p. 72)", name: "Nordheia", area: "Gimsøya", lat: 68.3050, lng: 14.1500, elev: 550, diff: "MS", isClassic: false, gully: false, desc: "Dossi regolari con vista spettacolare sul ponte di Gimsøystraumen." },

            // SEZIONE 2: Austvågøya South
            { bookRef: "2.1 (p. 88)", name: "Sydalsfjellet", area: "Sydal", lat: 68.3300, lng: 14.5200, elev: 730, diff: "BS", isClassic: true, gully: false, desc: "Classica salita sopra il fiordo di Sydal con pendii regolari e splendida vista mare." },
            { bookRef: "2.2 (p. 90)", name: "Borkkvantotinden", area: "Austvågøya", lat: 68.3150, lng: 14.4800, elev: 650, diff: "BS", isClassic: false, gully: false, desc: "Vetta appartata vicino a Sydal con ottima sciata su pendii poco battuti." },
            { bookRef: "2.3 (p. 92)", name: "Kleppstadheia", area: "Kleppstad", lat: 68.2560, lng: 14.2800, elev: 500, diff: "MS", isClassic: false, gully: false, desc: "Gita introduttiva di grande respiro panoramico verso l'isola di Henningsvær." },
            { bookRef: "2.4 (p. 94)", name: "Kroktinden", area: "Sydal", lat: 68.3200, lng: 14.5000, elev: 700, diff: "BS", isClassic: false, gully: false, desc: "Bella vetta conica con discesa continua ed esposta verso il fiordo." },
            { bookRef: "2.5 (p. 96)", name: "Glomtinden", area: "Rørvikskaret", lat: 68.2163, lng: 14.4042, elev: 419, diff: "MS", isClassic: true, gully: false, desc: "Classica veloce lungo la vecchia strada del colle. Perfetta per mezza giornata." },
            { bookRef: "2.6 (p. 98)", name: "Varden", area: "Svolvær", lat: 68.2435, lng: 14.5458, elev: 464, diff: "MS", isClassic: true, gully: false, desc: "La gita di riferimento di Svolvær, con partenza dall'asilo di Knutmarka." },
            { bookRef: "2.7 (p. 102)", name: "Stortinden", area: "Svolvær", lat: 68.2550, lng: 14.5350, elev: 730, diff: "BS", isClassic: false, gully: false, desc: "Cima imponente alle spalle del Varden, pendii più sostenuti e tecnici." },
            { bookRef: "2.8 (p. 106)", name: "Spisstinden", area: "Svolvær", lat: 68.2600, lng: 14.5500, elev: 650, diff: "BS", isClassic: false, gully: false, desc: "Guglia affilata che richiede buone condizioni di stabilità della neve." },
            { bookRef: "2.9 (p. 108)", name: "Dronningtinden", area: "Svolvær", lat: 68.2650, lng: 14.5600, elev: 680, diff: "BS", isClassic: false, gully: false, desc: "Cima della 'Regina' nel settore interno montuoso di Svolvær." },
            { bookRef: "2.10 (p. 110)", name: "Topp 576 (Kongstindryggen)", area: "Svolvær", lat: 68.2450, lng: 14.5200, elev: 576, diff: "BS", isClassic: false, gully: false, desc: "Cresta sciabile sopra il centro sciistico locale Kongstind." },
            { bookRef: "2.11 (p. 112)", name: "Topp 616 (Kongstindryggen)", area: "Svolvær", lat: 68.2480, lng: 14.5220, elev: 616, diff: "BS", isClassic: false, gully: false, desc: "Punto culminante della cresta di Kongstinden, vista sul Vestfjorden." },
            { bookRef: "2.12 (p. 114)", name: "Store Kongstinden", area: "Svolvær", lat: 68.2460, lng: 14.5150, elev: 552, diff: "BS", isClassic: false, gully: false, desc: "Vetta principale del massiccio di Kongstind con canali e pendii divertenti." },
            { bookRef: "2.13 (p. 116)", name: "Lille Kongstinden", area: "Svolvær", lat: 68.2420, lng: 14.5100, elev: 390, diff: "MS", isClassic: false, gully: false, desc: "Salita breve e rapida alle porte della cittadina." },
            { bookRef: "2.14 (p. 118)", name: "Mingmaurtindan", area: "Austvågøya", lat: 68.2520, lng: 14.5700, elev: 600, diff: "BS", isClassic: false, gully: false, desc: "Ambiente selvaggio e poco frequentato nel bacino orientale di Svolvær." },
            { bookRef: "2.15 (p. 122)", name: "Hans Meyer-fjellet", area: "Laukvik", lat: 68.3550, lng: 14.4500, elev: 580, diff: "MS", isClassic: false, gully: false, desc: "Montagna aperta a nord-ovest sopra Laukvik con viste mozzafiato sull'Oceano." },
            { bookRef: "2.16 (p. 124)", name: "Rismålstindan", area: "Austvågøya", lat: 68.2750, lng: 14.4800, elev: 650, diff: "BS", isClassic: false, gully: false, desc: "Crestine panoramiche e valloni appartati dell'entroterra." },
            { bookRef: "2.17 (p. 126)", name: "Tjeldborgtinden", area: "Kabelvåg", lat: 68.2200, lng: 14.4900, elev: 444, diff: "MS", isClassic: false, gully: false, desc: "Splendida anticima panoramica tra le baie di Kabelvåg e Svolvær." },
            { bookRef: "2.18 (p. 130)", name: "Fløya", area: "Svolvær", lat: 68.2490, lng: 14.5750, elev: 590, diff: "BS", isClassic: false, gully: false, desc: "La celebre montagna sopra la guglia rocciosa dello Svolværgeita." },
            { bookRef: "2.19 (p. 132)", name: "Tuva", area: "Svolvær", lat: 68.2580, lng: 14.5300, elev: 475, diff: "MS", isClassic: false, gully: false, desc: "Panettone nevoso accessibile e sicuro, spesso combinato con il Varden." },
            { bookRef: "2.20 (p. 134)", name: "Jomfrutindan 560 m", area: "Austvågøya", lat: 68.2700, lng: 14.5800, elev: 560, diff: "MS", isClassic: false, gully: false, desc: "Primo picco del vallone di Jomfrudalen, ottimo riparo dal vento." },
            { bookRef: "2.21 (p. 136)", name: "Jomfrutindan 587 m", area: "Austvågøya", lat: 68.2730, lng: 14.5850, elev: 587, diff: "BS", isClassic: false, gully: false, desc: "Punto più alto della dorsale di Jomfrutindan con pendio finale più ripido." },
            { bookRef: "2.22 (p. 138)", name: "Botntinden", area: "Austvågøya", lat: 68.3400, lng: 14.6500, elev: 750, diff: "BS", isClassic: false, gully: false, desc: "Isolato sperone che scende direttamente nel braccio interno dell'Austnesfjorden." },
            { bookRef: "2.23 (p. 142)", name: "Torskmannen", area: "Sydal", lat: 68.3371, lng: 14.5367, elev: 755, diff: "BS", isClassic: true, gully: false, desc: "Grande classica! Pendio continuo ed uniforme da cima a fondo ideale per sciare." },
            { bookRef: "2.24 (p. 146)", name: "Rundfjellet", area: "Laupstad", lat: 68.3850, lng: 14.6900, elev: 803, diff: "BS", isClassic: true, gully: false, desc: "La classica dell'Austnesfjorden con discesa spettacolare su Vaterfjorden." },
            { bookRef: "2.25 (p. 150)", name: "Lille Kvittinden", area: "Austnesfjorden", lat: 68.3500, lng: 14.6000, elev: 620, diff: "MS", isClassic: false, gully: false, desc: "Anticima comoda e sicura prima di salire al maestoso Store Kvittind." },

            // SEZIONE 3: Austvågøya North
            { bookRef: "3.1 (p. 166)", name: "Matmora", area: "Delp", lat: 68.3720, lng: 14.3500, elev: 788, diff: "BS", isClassic: true, gully: false, desc: "Regina del versante nord-occidentale. Discesa con vista sterminata sull'oceano aperto." },
            { bookRef: "3.2 (p. 168)", name: "Torskmannen (Nord)", area: "Austvågøya", lat: 68.3390, lng: 14.5380, elev: 755, diff: "BS", isClassic: true, gully: false, desc: "Accesso alternativo e versanti nord della classica montagna di Sydal." },
            { bookRef: "3.3 (p. 172)", name: "Breitinden", area: "Laupstad", lat: 68.3500, lng: 14.6200, elev: 700, diff: "BS", isClassic: false, gully: false, desc: "Cima massiccia situata vicino a Torskmannen con ampi valloni glaciali." },
            { bookRef: "3.4 (p. 176)", name: "Baken", area: "Austvågøya North", lat: 68.3650, lng: 14.6100, elev: 680, diff: "BS", isClassic: false, gully: false, desc: "Cresta e colle tra la conca di Kvittind e le valli orientali." },
            { bookRef: "3.5 (p. 178)", name: "Kistbergtinden", area: "Laupstad", lat: 68.3600, lng: 14.6300, elev: 750, diff: "BS", isClassic: false, gully: false, desc: "Dossi regolari e discesa costante verso il fiordo." },
            { bookRef: "3.6 (p. 182)", name: "Store Kvittinden", area: "Austnesfjorden", lat: 68.3571, lng: 14.6062, elev: 745, diff: "MS", isClassic: true, gully: false, desc: "Una delle gite più amate di tutte le Lofoten. Salita sicura e sciata eccellente." },
            { bookRef: "3.7 (p. 186)", name: "Pilan", area: "Laupstad", lat: 68.3686, lng: 14.6543, elev: 828, diff: "BS", isClassic: true, gully: false, desc: "Il must-have assoluto delle Lofoten. Parcheggio sulla E10 e vista maestosa sul Geitgaljen." },
            { bookRef: "3.8 (p. 190)", name: "Sautinden", area: "Laupstad", lat: 68.3686, lng: 14.6543, elev: 596, diff: "MS", isClassic: true, gully: false, desc: "Anticima di Pilan, perfetta per giornate corte o per raddoppiare la sciata." },
            { bookRef: "3.9 (p. 192)", name: "Geitgallien", area: "Laupstad", lat: 68.3751, lng: 14.6738, elev: 1085, diff: "OSA", isClassic: true, gully: false, desc: "La regina indiscussa delle Lofoten. Più di 1000m di dislivello continuo sopra il mare." },

            // ITINERARI EXTRA / CANALI TECNICI (Con Picca & Ramponi)
            { bookRef: "Extra Canale", name: "Geitgallien (South Gully)", area: "Laupstad", lat: 68.3751, lng: 14.6738, elev: 1085, diff: "OSA", isClassic: true, gully: true, desc: "Il canale sud del Geitgallien. Bootpack ripido (>40°), piccozza e ramponi necessari." },
            { bookRef: "Extra Canale", name: "Trollrenna", area: "Trollfjorden (Barca)", lat: 68.3700, lng: 14.9400, elev: 900, diff: "OSA", isClassic: true, gully: true, desc: "Il canale leggendario dei Troll a picco sull'acqua. Salita severa con picca e ramponi." },
            { bookRef: "Extra Canale", name: "Presten Gully", area: "Henningsvær", lat: 68.1670, lng: 14.2140, elev: 400, diff: "OS", isClassic: false, gully: true, desc: "Canale incassato a picco sul mare a ridosso del pilastro di roccia di Presten." },
            { bookRef: "Extra Canale", name: "Trolldalen Gully", area: "Kabelvåg", lat: 68.2250, lng: 14.4250, elev: 500, diff: "OS", isClassic: false, gully: true, desc: "Canale stretto e ripido dove salire con sci sullo zaino e ramponi." },
            { bookRef: "Extra Canale", name: "Skokkelvika Gullys", area: "Vestvågøya", lat: 68.1950, lng: 13.7150, elev: 500, diff: "OS", isClassic: false, gully: true, desc: "Canali nord incassati, ideali per neve fredda e ripida." },
            { bookRef: "Extra Barca", name: "Store Trolltind", area: "Trollfjorden (Barca)", lat: 68.3600, lng: 14.9500, elev: 1000, diff: "OSA", isClassic: false, gully: false, desc: "Accesso in barca. Ambiente alpino severo sopra il fiordo isolato." },
            { bookRef: "Extra Barca", name: "TM7", area: "Trollfjorden (Barca)", lat: 68.3650, lng: 14.9600, elev: 800, diff: "OS", isClassic: false, gully: true, desc: "Ripidi pendii e canali spettacolari che precipitano in mare nel fiordo dei Troll." },
            { bookRef: "Extra Barca", name: "Blåskavltinden", area: "Trollfjorden (Barca)", lat: 68.3800, lng: 14.9700, elev: 1000, diff: "OSA", isClassic: false, gully: true, desc: "Picco artico con ghiacciaio sommitale, creste affilate e discesa tecnica." },
            { bookRef: "Extra Sud", name: "Naveren", area: "Flakstadøya", lat: 68.0460, lng: 13.2950, elev: 695, diff: "BS", isClassic: false, gully: false, desc: "Vetta solitaria a sud dell'isola di Flakstad con vista sul Vestfjorden." },
            { bookRef: "Extra Sud", name: "Store Klauva", area: "Flakstad", lat: 68.1060, lng: 13.3850, elev: 775, diff: "BS", isClassic: false, gully: false, desc: "Dorsale vicina a Napp con neve spesso polverosa." }
        ];

        const map = L.map('map', { zoomControl: false }).setView([68.27, 14.20], 9);
        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/{z}/{y}/{x}.png', {
            maxZoom: 18, attribution: '© Kartverket'
        }).addTo(map);

        function getColor(d) {
            return d === 'MS' ? '#22c55e' : d === 'BS' ? '#3b82f6' : d === 'OS' ? '#f97316' : '#ef4444';
        }

        let markers = [];
        let userLocationMarker = null;

        function locateUser() {
            if (!navigator.geolocation) {
                alert("La geolocalizzazione GPS non è supportata dal browser.");
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    if (userLocationMarker) {
                        map.removeLayer(userLocationMarker);
                    }
                    userLocationMarker = L.circleMarker([lat, lng], {
                        radius: 8, fillColor: "#38bdf8", color: "#ffffff", weight: 3, opacity: 1, fillOpacity: 0.9
                    }).addTo(map).bindPopup("<b>La tua posizione attuale</b>").openPopup();
                    map.setView([lat, lng], 11);
                },
                (err) => {
                    alert("Impossibile recuperare la posizione GPS.");
                },
                { enableHighAccuracy: true }
            );
        }

        function renderRoutes(data) {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            const list = document.getElementById('route-list');
            list.innerHTML = '';

            data.forEach(route => {
                const navMap = 'https://www.google.com/maps/dir/?api=1&destination=' + route.lat + ',' + route.lng;
                const searchGoogle = 'https://www.google.com/search?q=' + encodeURIComponent(route.name + ' scialpinismo');
                const searchWikiloc = 'https://www.google.com/search?q=' + encodeURIComponent(route.name + ' scialpinismo wikiloc');
                const photoSearch = 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(route.name + ' Lofoten ski touring');
                const varsomUrl = 'https://www.varsom.no/en/avalanche-bulletins/';

                const classicBadge = route.isClassic ? `<span class="badge badge-classic">⭐ CLASSICA</span>` : '';
                const gullyBadge = route.gully ? `<span class="badge badge-gully">⛏️ CANALE</span>` : '';
                const bookBadge = `<span class="badge badge-book">📖 ${route.bookRef}</span>`;

                const popup = `
                    <div class="popup-content">
                        <h3>${route.name}</h3>
                        <div class="popup-info">
                            <strong><i class="fa-solid fa-book"></i> Guida:</strong> ${route.bookRef}<br>
                            <strong><i class="fa-solid fa-location-dot"></i> Zona:</strong> ${route.area}<br>
                            <strong>Quota:</strong> ${route.elev}m | Diff: <span class="badge ${route.diff}">${route.diff}</span> ${classicBadge} ${gullyBadge}<br>
                            <p style="margin-top:6px; font-size:0.75rem;">${route.desc}</p>
                        </div>
                        <div class="popup-links">
                            <a href="${navMap}" target="_blank" class="gmaps-btn"><i class="fa-solid fa-car"></i> Naviga al Parcheggio</a>
                            <a href="${searchWikiloc}" target="_blank" class="btn-wikiloc"><i class="fa-solid fa-route"></i> Wikiloc: Traccia e GPX</a>
                            <a href="${photoSearch}" target="_blank" class="btn-photo"><i class="fa-solid fa-camera"></i> Foto Reali della Cima</a>
                            <a href="${searchGoogle}" target="_blank" class="btn-review"><i class="fa-brands fa-google"></i> Cerca "${route.name} scialpinismo"</a>
                            <a href="${varsomUrl}" target="_blank" class="btn-varsom"><i class="fa-solid fa-triangle-exclamation"></i> Varsom: Bollettino Neve</a>
                        </div>
                    </div>`;

                const marker = L.marker([route.lat, route.lng], { 
                    icon: L.divIcon({
                        className: 'custom-pin',
                        html: `<div style="background-color: ${getColor(route.diff)}; width:16px; height:16px; border-radius:50%; border:2px solid ${route.isClassic ? '#eab308' : 'white'}; box-shadow:0 0 5px #000;"></div>`,
                        iconSize: [16, 16]
                    })
                }).bindPopup(popup).addTo(map);

                markers.push(marker);

                const card = document.createElement('div');
                card.className = 'route-card ' + route.diff;
                card.innerHTML = `
                    <div class="route-title">
                        <span>${route.name}</span>
                        <div class="route-badges">
                            ${bookBadge}
                            ${classicBadge}
                            <span class="badge ${route.diff}">${route.diff}</span>
                            ${gullyBadge}
                        </div>
                    </div>
                    <div class="route-meta">
                        <span><i class="fa-solid fa-mountain"></i> ${route.elev}m</span>
                        <span><i class="fa-solid fa-location-dot"></i> ${route.area}</span>
                    </div>
                    <div class="route-desc">${route.desc}</div>`;

                card.addEventListener('click', () => { map.setView([route.lat, route.lng], 13); marker.openPopup(); });
                list.appendChild(card);
            });
        }

        let currentDifficulty = 'ALL';
        function filterDifficulty(diff, btn) {
            currentDifficulty = diff;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            applyFilters();
        }

        function filterRoutes() {
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = routes.filter(r => {
                let matchesDiff = false;
                if (currentDifficulty === 'ALL') matchesDiff = true;
                else if (currentDifficulty === 'CLASSIC') matchesDiff = r.isClassic === true;
                else if (currentDifficulty === 'GULLY') matchesDiff = r.gully === true;
                else matchesDiff = (r.diff === currentDifficulty);

                const matchesQuery = r.name.toLowerCase().includes(query) || 
                                     r.area.toLowerCase().includes(query) || 
                                     r.bookRef.toLowerCase().includes(query);
                return matchesDiff && matchesQuery;
            });
            renderRoutes(filtered);
        }

        renderRoutes(routes);
    </script>
</body>
</html>
