<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lofoten Ski Touring - Mappa Interattiva 50 Itinerari</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #1e293b;
            color: #f8fafc;
            overflow: hidden;
        }

        /* Sidebar Container */
        #sidebar {
            width: 380px;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #334155;
            z-index: 1000;
            box-shadow: 4px 0 15px rgba(0,0,0,0.3);
        }

        .header {
            padding: 20px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
        }

        .header h1 {
            font-size: 1.25rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header p {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 5px;
        }

        /* Controlli Filtro e Ricerca */
        .controls {
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 12px 10px 35px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            font-size: 0.9rem;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .filter-buttons {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .filter-btn {
            flex: 1;
            padding: 6px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            background: #1e293b;
            color: #94a3b8;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: #0284c7;
            color: #fff;
        }

        .gps-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .gps-btn:hover {
            background: #059669;
        }

        /* Lista Itinerari */
        #route-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .route-card {
            background: #1e293b;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 10px;
            cursor: pointer;
            border-left: 4px solid #cbd5e1;
            transition: transform 0.15s, background 0.15s;
        }
